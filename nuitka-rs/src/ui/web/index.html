<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuitka++</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="wizard" class="wizard">
  <div class="wizard-head">
    <div class="app-mark">N</div>
    <div class="wizard-title">
      <h1>Nuitka++</h1>
      <p class="caption">可视化 Nuitka 打包工具</p>
    </div>
  </div>

  <div class="wizard-body">
    <div class="status-line">
      <div class="ring" id="ring"></div>
      <span id="lead">正在检查编译环境…</span>
    </div>

    <div class="result hidden" id="result">
      <div class="verdict">
        <span class="dot" id="dot"></span>
        <span id="levelText">—</span>
      </div>
      <dl class="facts">
        <dt>Python</dt>
        <dd><span id="pythonText">—</span><small class="path" id="pythonPath"></small></dd>
        <dt>Nuitka</dt>
        <dd id="nuitkaText">—</dd>
        <dt>编译器</dt>
        <dd id="compilerText">—</dd>
      </dl>
      <p class="tip" id="hint">—</p>
    </div>
  </div>

  <div class="wizard-foot">
    <button class="btn secondary" id="prepare">准备环境</button>
    <button class="btn primary" id="primary" disabled>请稍候</button>
  </div>
</div>

<div id="main" class="hidden">
  <header class="commandbar">
    <div class="commandbar-title">
      <span class="app-mark small">N</span>
      <span>Nuitka++</span>
    </div>
    <button class="btn secondary" id="rescan">重新扫描</button>
  </header>

  <main class="workspace">
    <section class="panel">
      <h2>Python</h2>
      <pre id="rPython">—</pre>
    </section>
    <section class="panel">
      <h2>Nuitka</h2>
      <pre id="rNuitka">—</pre>
    </section>
    <section class="panel wide">
      <h2>编译器</h2>
      <pre id="rCompilers">—</pre>
    </section>
    <section class="panel wide accent">
      <h2>推荐</h2>
      <p id="rRec">—</p>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
